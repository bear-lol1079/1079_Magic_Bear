<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>#1079 LoL App – Combined (Magic Ratio & Option‑A)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root{
      --bg:#0f1116; --panel:#1a1d24; --muted:#9aa4b2; --text:#e8eaed;
      --accent:#3b82f6; --accent-2:#2563eb; --border:#2d3340;
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      background:var(--bg); color:var(--text);
      display:flex; flex-direction:column;
    }
    header{ padding:20px 16px; }
    h1{ margin:0; font-size:1.25rem; }

    .tabs{
      display:flex; gap:8px; padding:0 16px 12px; border-bottom:1px solid var(--border);
      flex-wrap:wrap;
    }
    .tab{
      appearance:none; border:1px solid var(--border); background:#121620; color:var(--text);
      padding:10px 14px; border-radius:8px; cursor:pointer; font-size:0.95rem;
    }
    .tab:hover{ border-color:#3b82f688; }
    .tab.active{
      background:var(--accent); border-color:var(--accent); color:white;
    }

    .views{
      /* fill remaining height under header/tabs */
      flex:1 1 auto; min-height:0; /* allow children to size */
      position:relative;
    }
    .view-frame{
      position:absolute; inset:0; width:100%; height:100%;
      border:0; display:block; background:#0e121a;
    }
    .view-frame[hidden]{ display:none !important; }
  </style>
</head>
<body>
  <header>
    <h1>#1079 LoL App – Combined (Magic Ratio & Option‑A)</h1>
  </header>

  <nav class="tabs">
    <button class="tab active" data-target="magic">Magic Ratio</button>
    <button class="tab" data-target="optiona">Option‑A</button>
  </nav>

  <section class="views">
    <!-- Important: each iframe loads the original app intact -->
    <iframe
      id="view-magic"
      class="view-frame"
      src="magic/index1.html"
      title="Magic Ratio"
      loading="eager"
    ></iframe>

    <iframe
      id="view-optiona"
      class="view-frame"
      src="option-a/index2.html"
      title="Option‑A"
      loading="lazy"
      hidden
    ></iframe>
  </section>

  <script>
    const tabs = document.querySelectorAll('.tab');
    const frames = {
      magic:   document.getElementById('view-magic'),
      optiona: document.getElementById('view-optiona')
    };

    function show(which){
      // toggle buttons
      tabs.forEach(btn => btn.classList.toggle('active', btn.dataset.target === which));
      // toggle frames
      for (const k in frames) {
        frames[k].hidden = (k !== which);
      }
      // update hash for deep links / bookmarking
      history.replaceState(null, '', '#' + which);
    }

    tabs.forEach(btn => {
      btn.addEventListener('click', () => show(btn.dataset.target));
    });

    // Open by hash if present, else default to Magic
    const initial = (location.hash || '').replace('#','').toLowerCase();
    if (initial === 'optiona') {
      show('optiona');
    } else {
      show('magic');
    }
  </script>
</body>
</html>
